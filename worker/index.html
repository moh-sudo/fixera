<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fixera Partner — Earn With Us</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C9A020" />
    <meta name="description" content="Accept jobs, track earnings, and grow your business with Fixera Partner." />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fixera Partner" />
    <link rel="apple-touch-icon" href="/partner-icon.svg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/partner-icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('[PWA] Partner service worker registered:', reg.scope))
            .catch(err => console.log('[PWA] Partner service worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
