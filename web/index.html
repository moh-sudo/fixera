<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fixera — Home Services</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#C9A020" />
    <meta name="description" content="One Call. We Fix It All. Plumbing, Electrical, Cleaning, Painting & more in Nairobi, Kenya." />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fixera" />
    <link rel="apple-touch-icon" href="/fixera-icon.svg" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/fixera-icon.svg" />

    <!-- Open Graph -->
    <meta property="og:title" content="Fixera — Home Services" />
    <meta property="og:description" content="Book trusted plumbers, electricians, cleaners and painters in Nairobi." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/fixera-icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('[PWA] Service worker registered:', reg.scope))
            .catch(err => console.log('[PWA] Service worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
